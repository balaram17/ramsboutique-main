name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        env: # ◄ Moved env outside of the "with" block
          REACT_APP_API_BASE_URL: https://ramsboutique-api-prod-endcc7bmbegsanca.southindia-01.azurewebsites.net
          REACT_APP_ENTRA_WORKFORCE_CLIENT_ID: 08b67a6a-08df-4100-b794-a2f5bbba624f
          REACT_APP_ENTRA_WORKFORCE_AUTHORITY: https://login.microsoftonline.com/cc5a2bb5-7f05-4fd5-b5c0-65cda6b7fdd5
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: ""
          output_location: "build"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
